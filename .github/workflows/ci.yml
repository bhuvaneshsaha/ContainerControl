# Merge gate for pull requests into main.
# .NET comes only from global.json (SDK 10.0.100, rollForward latestFeature).
# Node is pinned to the 22 LTS line (Jod), currently 22.23.3.
# The dotnet job uses the Docker Engine already on ubuntu-latest. Testcontainers
# uses that engine. This workflow does not install Docker Desktop and does not
# add docker.sock mounts. Before integration tests it strips Azure search/domain
# lines from resolv.conf and restarts the engine with public DNS, so in-container
# nslookup does not append *.bx.internal.cloudapp.net. It stores no secrets.
# Release and tag publishing is a follow-up.
# Both jobs must succeed. A test failure fails its job.

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TESTCONTAINERS_HOST_OVERRIDE: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ContainerControl.sln

      - name: Build
        run: dotnet build ContainerControl.sln -c Release --no-restore

      # The hosted runner's Docker Engine is already available. Do not install
      # Docker Desktop and do not bind-mount the host socket.
      # Azure runners put a search domain on resolv.conf. Docker's embedded DNS
      # (127.0.0.11) then appends *.bx.internal.cloudapp.net to names looked up
      # inside a container. Strip those lines and point the engine at public DNS.
      - name: Harden Docker DNS
        run: |
          if [ -f /etc/resolv.conf ]; then
            sudo cp /etc/resolv.conf /etc/resolv.conf.bak
            sudo sed -i '/^search /d; /^domain /d' /etc/resolv.conf || true
          fi
          sudo mkdir -p /etc/docker
          echo '{"dns":["8.8.8.8","1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info

      - name: Integration tests
        run: dotnet test tests/ContainerControl.Host.IntegrationTests/ContainerControl.Host.IntegrationTests.csproj -c Release --no-build

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: client/package-lock.json
          package-manager-cache: false

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      # @angular/build:unit-test runs Vitest in jsdom. No browser provider is configured,
      # so this stays non-interactive without client source changes. --watch=false forces
      # a single run; CI=true does the same when the runner has no TTY.
      - name: Client unit tests
        working-directory: client
        run: npm test -- --watch=false
