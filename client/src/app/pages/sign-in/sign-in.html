<mat-card class="max-w-xl">
  <mat-card-content>
    <h1>Sign in</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-text-field label="Email" inputId="email" type="email" autocomplete="username" formControlName="email" [error]="fieldError(form.controls.email, { required: 'Enter an email.', email: 'Enter a valid email.' })" />
      <app-text-field label="Password" inputId="password" type="password" autocomplete="current-password" formControlName="password" [error]="fieldError(form.controls.password, { required: 'Enter a password.' })" />
      <button mat-flat-button type="submit" [disabled]="submitting()" [attr.aria-busy]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
