<h1>Sign in</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <label for="email">Email</label>
  <input id="email" type="email" formControlName="email" autocomplete="username" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" [attr.aria-describedby]="errorMessage() ? 'sign-in-error' : null" />

  <label for="password">Password</label>
  <input id="password" type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched" [attr.aria-describedby]="errorMessage() ? 'sign-in-error' : null" />

  <button type="submit" [disabled]="submitting()">Sign in</button>
  @if (errorMessage()) {
    <p id="sign-in-error" role="alert">{{ errorMessage() }}</p>
  }
</form>
