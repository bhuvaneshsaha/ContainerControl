@if (confirm.request(); as request) {
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 p-4" (click)="confirm.answer(false)">
    <div
      class="w-full max-w-md rounded-lg border border-neutral-300 bg-white p-4 shadow-lg"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-body"
      cdkTrapFocus
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-title" class="text-xl">{{ request.title }}</h2>
      <p id="confirm-body">{{ request.body }}</p>
      @if (request.irreversible) {
        <p class="font-semibold">This cannot be undone.</p>
      }
      <div class="mt-4 flex flex-wrap gap-2">
        <button #cancel mat-stroked-button type="button" (click)="confirm.answer(false)">{{ request.cancelLabel }}</button>
        @if (request.irreversible) {
          <button mat-stroked-button color="warn" type="button" (click)="confirm.answer(true)">{{ request.confirmLabel }}</button>
        } @else {
          <button mat-stroked-button type="button" (click)="confirm.answer(true)">{{ request.confirmLabel }}</button>
        }
      </div>
    </div>
  </div>
}
