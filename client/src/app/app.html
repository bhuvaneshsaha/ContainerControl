<header class="shell-header">
  <p class="product">ContainerControl</p>
  @if (signedIn()) {
    <nav aria-label="Primary">
      <a routerLink="/permissions">My access</a>
      <a *appHasPermission="'apps.read'" routerLink="/apps">Applications</a>
      @if (canOpenAccess()) {
        <a routerLink="/access">Access</a>
      }
      <a *appHasPermission="'platform.hosts.manage'" routerLink="/hosts">Hosts</a>
      @if (canOpenCapacity()) {
        <a routerLink="/capacity">Capacity</a>
      }
      <a *appHasPermission="'registries.read'" routerLink="/registries">Registries</a>
      <a *appHasPermission="'edge.dns.manage'" routerLink="/domains">Domains</a>
      <a *appHasPermission="'access.tokens.manage'" routerLink="/tokens">Tokens</a>
    </nav>
    <button type="button" (click)="signOut()">Sign out</button>
  }
</header>
<main>
  <app-feedback-banner />
  <router-outlet />
</main>
<app-confirm-dialog />
